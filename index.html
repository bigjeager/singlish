<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A14">
<title>Singlish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Gentium+Book+Plus&display=swap">
<style>
/* A night-mode music app on purpose: one dark look, lit by the current song's cover art. */
:root{
  color-scheme:dark;
  --bg:#0B0A14; --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.1); --glass-3:rgba(255,255,255,.16);
  --stroke:rgba(255,255,255,.09); --stroke-2:rgba(255,255,255,.18);
  --ink:#F7F5FF; --soft:#D4D0EC; --muted:#928EB3; --dim:#5D5A7C;
  --hot:#FF4D8D; --coral:#FF7A59; --amber:#FFB547; --hl:#FFE14A; --hl-ink:#1D1426;
  --grad:linear-gradient(95deg,var(--hot),var(--coral) 55%,var(--amber));
  --f-display:"Bricolage Grotesque","Avenir Next","PingFang SC",system-ui,sans-serif;
  --f-body:"Figtree",-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-ipa:"Gentium Book Plus","Charis SIL","Lucida Sans Unicode","Segoe UI",serif;
  --ctl-h:76px;
  --art:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--amber)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ambient cover-art glow behind everything */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ambient i{position:absolute;inset:-15%;background:center/cover no-repeat;filter:blur(90px) saturate(1.7);opacity:0;transition:opacity 1.2s ease;transform:scale(1.1)}
.ambient i.show{opacity:.5}
.ambient::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 70% 0%,transparent,var(--bg) 75%)}
.top,.app,.start{position:relative;z-index:1}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:18px;padding:14px 28px;
  background:color-mix(in srgb,var(--bg) 62%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--stroke)}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo h1{margin:0;font:800 24px/1 var(--f-display);letter-spacing:-.03em;white-space:nowrap}
.logo h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.eq{display:inline-flex;align-items:flex-end;gap:3px;height:20px}
.eq i{width:4px;height:6px;border-radius:2px;background:var(--grad);transition:height .3s}
body.is-playing .eq i{animation:eq .8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.2s!important}.eq i:nth-child(3){animation-delay:-.45s!important}.eq i:nth-child(4){animation-delay:-.1s!important}
@keyframes eq{0%{height:4px}100%{height:20px}}
.tagline{margin:0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .grow{flex:1}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.prog b{color:var(--ink);font-weight:700}
.prog-bar{width:120px;height:6px;border-radius:99px;background:var(--glass-2);overflow:hidden}
.prog-bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:inherit;transition:width .6s cubic-bezier(.3,.7,.3,1)}
.btn-list{display:none;border:1px solid var(--stroke-2);background:var(--glass);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:700}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(400px,470px);gap:32px;padding:24px 28px 40px;align-items:start;max-width:1480px;margin:0 auto}
.browser{min-width:0}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1 1 240px;position:relative;min-width:0}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;color:var(--muted)}
.search input{width:100%;height:42px;border:1px solid var(--stroke);background:var(--glass);color:var(--ink);border-radius:999px;padding:0 16px 0 40px;font:inherit;font-size:14px}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--stroke-2);background:var(--glass-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{height:34px;border:1px solid var(--stroke);background:transparent;border-radius:999px;padding:0 14px;font-size:13px;font-weight:600;color:var(--soft)}
.chips button:hover{background:var(--glass)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{font-size:12px;color:var(--muted);margin:0 0 14px;letter-spacing:.08em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:14px}

/* card = record sleeve with the song's disc peeking out */
.card{--r:18px;position:relative;overflow:hidden;text-align:left;border:1px solid var(--stroke);background:var(--glass);border-radius:var(--r);padding:16px 16px 14px;display:flex;flex-direction:column;gap:3px;min-height:150px;
  transition:transform .2s cubic-bezier(.3,.7,.3,1),background .2s,border-color .2s}
.card:hover{transform:translateY(-3px) rotate(-.4deg);background:var(--glass-2);border-color:var(--stroke-2)}
.card .disc{position:absolute;top:-18px;right:-18px;width:78px;height:78px;border-radius:50%;overflow:hidden;
  background:#111;box-shadow:0 0 0 5px rgba(0,0,0,.55),0 6px 18px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.3,.7,.3,1)}
.card .disc img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.15)}
.card .disc::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,var(--bg) 0 5px,rgba(0,0,0,.35) 6px 11px,transparent 12px),repeating-radial-gradient(circle,rgba(0,0,0,.14) 0 1px,transparent 1px 4px)}
.card:hover .disc{transform:translate(-6px,6px) rotate(40deg)}
.card.playing .disc{animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card .no{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.card .w{margin-top:10px;font:700 24px/1.05 var(--f-display);letter-spacing:-.025em;overflow-wrap:anywhere;padding-right:30px}
.card .ph{font:14px/1.3 var(--f-ipa);color:var(--muted)}
.card .mn{font-size:13px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sg{margin-top:auto;padding-top:10px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sg b{color:var(--soft);font-weight:600}
.card.done .no::after{content:"  ✓ 已唱";color:var(--amber);letter-spacing:.04em}
.card.on{border-color:transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,var(--grad) border-box;border:1.5px solid transparent}
.card.on .w{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.empty{color:var(--muted);padding:40px 0;text-align:center;grid-column:1/-1}

/* ---------- now playing ---------- */
.aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);display:flex;flex-direction:column;gap:14px}
.deck{position:relative;overflow:hidden;border-radius:26px;aspect-ratio:16/9;max-width:100%;display:flex;align-items:center;gap:22px;padding:22px;background:#15121F;box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 0 1px var(--stroke)}
.deck-bg{position:absolute;inset:-20%;background:center/cover no-repeat;filter:blur(40px) saturate(1.6) brightness(.7);transition:background-image .6s}
.deck-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(11,10,20,.25),rgba(11,10,20,.8) 70%)}
.deck-cover{position:relative;flex:none;height:100%;aspect-ratio:1;z-index:1}
.deck-cover > img{position:relative;z-index:2;width:100%;height:100%;object-fit:cover;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.6);background:#222}
.vinyl{position:absolute;z-index:1;top:4%;left:4%;width:92%;height:92%;border-radius:50%;
  background:radial-gradient(circle,#0B0A14 0 3%,transparent 3.5%),radial-gradient(circle,transparent 0 30%,#111 31%),repeating-radial-gradient(circle,#161320 0 2px,#0D0B14 2px 4px);
  box-shadow:0 8px 30px rgba(0,0,0,.6);transition:transform .7s cubic-bezier(.3,.7,.3,1)}
.vinyl img{position:absolute;inset:34%;width:32%;height:32%;border-radius:50%;object-fit:cover}
body.is-playing .vinyl{transform:translateX(42%)}
body.is-playing .vinyl img{animation:spin 2.4s linear infinite}
.deck-info{position:relative;z-index:1;min-width:0;display:flex;flex-direction:column;gap:4px;margin-left:12%;align-self:flex-end}
.deck-info b{font:800 22px/1.1 var(--f-display);letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.deck-info > span{font-size:13px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck-info a{margin-top:6px;font-size:12px;font-weight:700;color:var(--ink);text-decoration:none;opacity:.8;white-space:nowrap}
.deck-info a:hover{opacity:1;text-decoration:underline}
.clip{align-self:flex-start;margin-bottom:6px;background:rgba(11,10,20,.6);backdrop-filter:blur(8px);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:4px 11px;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
.clip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--hot);box-shadow:0 0 10px var(--hot)}
.deck-prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.1);z-index:2}
.deck-prog i{display:block;height:100%;width:0;background:var(--grad)}
.stage{position:relative;background:var(--glass);border:1px solid var(--stroke);border-radius:26px;padding:22px 24px 20px;display:flex;flex-direction:column;gap:12px;min-width:0;
  backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3)}
.st-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:700;letter-spacing:.04em;border-radius:999px;padding:3px 10px;background:var(--glass-2);color:var(--soft)}
.pill.band{background:var(--grad);color:#1A0C14}
.st-top .no{margin-left:auto;font-size:12px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
.st-word{margin:2px 0 0;font:800 clamp(40px,4.4vw,58px)/.95 var(--f-display);letter-spacing:-.045em;overflow-wrap:anywhere}
.st-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.st-ipa{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--stroke-2);background:transparent;border-radius:999px;padding:4px 12px 4px 10px;font:16px/1.4 var(--f-ipa);color:var(--soft);transition:background .2s,color .2s}
.st-ipa:hover{background:var(--ink);color:var(--bg)}
.st-mean{margin:0;font-size:17px;font-weight:700}
.st-en{margin:-4px 0 0;color:var(--muted);font-size:14px}

.lyrics{position:relative;height:190px;overflow:hidden;margin:4px -4px 0;padding:0 4px}
.stage.live .lyrics{-webkit-mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
.lyrics-in{padding:6px 0;transition:transform .55s cubic-bezier(.3,.7,.3,1)}
.stage.live .lyrics-in{padding:70px 0}
.ln{margin:0;padding:5px 0;font:700 20px/1.35 var(--f-display);letter-spacing:-.01em;color:var(--soft);isolation:isolate;transform-origin:left center;transition:transform .4s cubic-bezier(.3,.7,.3,1),opacity .4s,color .4s}
.stage.live .ln{color:var(--dim)}
.stage.live .ln.cur{color:var(--ink);transform:scale(1.06)}
.stage.live .ln.past{color:var(--muted);opacity:.6}
.lw{--p:0}
.stage.live .ln.cur .lw:not(.tw){background:var(--grad) 0 0/calc(var(--p)*100%) 100% no-repeat,linear-gradient(var(--ink),var(--ink));-webkit-background-clip:text;background-clip:text;color:transparent}
.tw{position:relative;white-space:nowrap;color:var(--hl-ink)!important;padding:0 .12em;margin:0 -.04em}
.tw::before{content:"";position:absolute;inset:.1em -.02em .02em;background:var(--hl);border-radius:.28em .18em .32em .2em;transform:skew(-7deg) rotate(-1.2deg);z-index:-1;box-shadow:0 0 22px rgba(255,225,74,.35)}
.stage.live .ln.cur .tw.hit::before{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:skew(-7deg) rotate(-1.2deg) scale(1)}45%{transform:skew(-7deg) rotate(-3deg) scale(1.18)}100%{transform:skew(-7deg) rotate(-1.2deg) scale(1)}}
.lyr-msg{color:var(--muted);font-size:13px;padding:10px 0}

.st-song{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:rgba(0,0,0,.22);min-width:0}
.st-song .mini{flex:none;width:42px;height:42px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px rgba(0,0,0,.5)}
body.is-playing .stage.live .st-song .mini{animation:spin 3.2s linear infinite}
.st-song div{min-width:0;display:flex;flex-direction:column}
.st-song b{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-song span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-note{margin:0;font-size:13px;color:var(--soft)}
.st-tip{font-size:13.5px;color:var(--soft);border:1px dashed var(--stroke-2);border-radius:14px;padding:9px 12px}
.st-tip b{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--amber);margin-right:8px}

/* ---------- controls ---------- */
.ctl{display:flex;align-items:center;gap:4px;background:var(--glass);border:1px solid var(--stroke);border-radius:999px;padding:8px 14px 8px 8px;
  backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3)}
.ctl button{border:0;background:transparent;border-radius:999px;height:42px;min-width:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;color:var(--soft);font-size:13px;font-weight:700;transition:background .15s,color .15s}
.ctl button:hover{background:var(--glass-2);color:var(--ink)}
.ctl .play{background:var(--grad);color:#1A0C14;width:54px;height:54px;box-shadow:0 8px 26px rgba(255,77,141,.45)}
.ctl .play:hover{background:var(--grad);color:#1A0C14;transform:scale(1.05)}
.ctl .tog[aria-pressed="true"]{color:var(--bg);background:var(--ink)}
.ctl .time{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hint{font-size:12px;color:var(--muted);margin:0;padding:0 8px}
.hint kbd{font:600 11px var(--f-body);border:1px solid var(--stroke-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--soft)}
.foot{grid-column:1/-1;font-size:12px;color:var(--dim);border-top:1px solid var(--stroke);padding-top:16px;max-width:80ch}
.carousel{display:none}
.start{display:none}
.browser-head{display:none;align-items:center;justify-content:space-between;margin-bottom:14px}
.browser-head h2{margin:0;font:800 26px var(--f-display);letter-spacing:-.03em}
.browser-head button{border:1px solid var(--stroke-2);background:var(--glass);border-radius:999px;padding:7px 15px;font-weight:700;font-size:13px}

/* ---------- phone ---------- */
@media (max-width:899px){
  body{overflow:hidden;display:flex;flex-direction:column;height:100%}
  .top{padding:10px 16px;gap:10px;flex:none}
  .logo h1{font-size:21px}
  .tagline,.prog-bar{display:none}
  .btn-list{display:inline-block}
  .app{display:flex;flex-direction:column;padding:0;flex:1;min-height:0;min-width:0;gap:0;width:100%;max-width:100vw}
  .aside{position:static;display:contents}
  #deskStage,.hint,.foot{display:none}
  .deck{flex:none;align-self:stretch;width:auto;margin:12px 16px 0;border-radius:22px;aspect-ratio:auto;height:132px;padding:14px;gap:14px}
  .deck-info a .long{display:none}
  .deck-info{margin-left:22%;align-self:center}
  .deck-info b{font-size:18px}
  .clip{margin-bottom:2px}
  .browser{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);display:none}
  .browser.open{display:block}
  .browser-head{display:flex}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .card .w{font-size:21px}
  .carousel{display:flex;flex:1;min-height:0;width:100%;min-width:0;max-width:100vw;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;
    padding-bottom:calc(var(--ctl-h) + env(safe-area-inset-bottom,0px) + 8px)}
  .carousel::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;padding:12px 16px 4px;display:flex;overflow-y:auto}
  .slide .stage{flex:1;padding:18px;gap:10px;min-height:100%;border-radius:24px}
  .st-word{font-size:44px}
  .slide .lyrics{height:auto;flex:1;min-height:150px}
  .ln{font-size:19px}
  .ctl{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;height:var(--ctl-h);padding:8px 12px 8px 10px;background:color-mix(in srgb,var(--bg) 70%,transparent)}
  .ctl .opt-label{display:none}
  .start{display:flex;position:fixed;inset:0;z-index:35;align-items:flex-end;justify-content:center;padding:0 16px calc(var(--ctl-h) + env(safe-area-inset-bottom,0px) + 28px);background:linear-gradient(transparent 40%,rgba(11,10,20,.85))}
  .start button{border:0;background:var(--grad);color:#1A0C14;border-radius:999px;padding:15px 26px;font-weight:800;font-size:17px;box-shadow:0 12px 36px rgba(255,77,141,.5);display:flex;flex-direction:column;align-items:center;gap:1px}
  .start button small{font-weight:600;font-size:12px;opacity:.8}
}
@media (max-width:420px){ .ctl .time{display:none} }
@media (prefers-reduced-motion:reduce){ *,*::before{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><i id="artA"></i><i id="artB"></i></div>

<header class="top">
  <div class="logo"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span><h1>Sing<span>lish</span></h1></div>
  <p class="tagline">听歌记单词 · 每个雅思词都藏在一段流行歌里</p>
  <div class="grow"></div>
  <div class="prog"><div class="prog-bar"><i id="progFill"></i></div><span><b id="doneCount">0</b> / <span id="totalCount">100</span> 已唱</span></div>
  <button class="btn-list" id="openList" type="button">词表</button>
</header>

<main class="app">
  <section class="browser" id="browser" aria-label="单词列表">
    <div class="browser-head"><h2>词表</h2><button type="button" id="closeList">关闭</button></div>
    <div class="filters">
      <label class="search"><span class="sr">搜索</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="搜单词、释义、歌名或歌手" autocomplete="off"></label>
      <div class="chips" id="bandChips" role="group" aria-label="按雅思分段筛选">
        <button type="button" data-b="" aria-pressed="true">全部</button>
        <button type="button" data-b="5.5" aria-pressed="false">5.5–6</button>
        <button type="button" data-b="6.5" aria-pressed="false">6.5</button>
        <button type="button" data-b="7" aria-pressed="false">7+</button>
      </div>
    </div>
    <p class="count" id="countLine"></p>
    <div class="grid" id="grid"></div>
  </section>

  <aside class="aside">
    <div class="deck" id="deck"><div class="deck-bg" id="deckBg"></div>
      <div class="deck-cover"><span class="vinyl"><img id="deckLabel" alt=""></span><img id="deckArt" alt=""></div>
      <div class="deck-info"><span class="clip" id="clipTag">30 秒试听</span><b id="deckTitle"></b><span id="deckArtist"></span><a id="deckLink" href="#" target="_blank" rel="noopener"><span class="long">在 </span>Apple Music<span class="long"> 听完整首</span> ↗</a></div>

album/rise/1445048853?i=1445048857&uo=4"},{"word":"worship","form":"worship","basic":false,"phonetic":"/ˈwɜːʃɪp/","pos":"v.","meaning":"崇拜；敬奉","formNote":"worshipped 为过去式/过去分词（英式双写 p）","en":"To show deep respect and love for a god or person.","tip":"worship sb as a hero 把某人奉为英雄","band":7,"artist":"Hozier","title":"Take Me to Church","lrclib":1398,"t":56.82,"offset":47.84,"preview":"https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/6e/22/7a/6e227a52-8f55-3306-6516-77e618594603/mzaf_80302051002176580.plus.aac.p.m4a","art":"https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/0e/99/33/0e9933fa-9865-95a8-399e-bdddf321aac5/886445578782.jpg/600x600bb.jpg","appleUrl":"https://music.apple.com/us/album/take-me-to-church/1053880167?i=1053880169&uo=4"}];
</script>
<script>
(() => {
const DATA = window.SONG_WORDS;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const mq = matchMedia('(max-width: 899px)');
const isMobile = () => mq.matches;
const pad = n => String(n).padStart(3, '0');
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

const state = { band: '', cur: 0, loop: false, auto: store.get('stw.auto', false), done: new Set(store.get('stw.done', [])), started: false };

/* ---------- lyrics (fetched at runtime; only the lines around the word are kept) ---------- */
const lyr = new Map();
function parseLrc(s) {
  return s.split('\n').map(l => { const m = l.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)$/); return m && { t: +m[1] * 60 + +m[2], x: m[3].trim() }; }).filter(Boolean);
}
function loadLyrics(i) {
  if (lyr.has(i)) return lyr.get(i);
  const e = DATA[i];
  const p = fetch(`https://lrclib.net/api/get/${e.lrclib}`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {
    const all = parseLrc(d.syncedLyrics || '');
    // The Apple preview covers [off, off+30) of the full track; only show lines that fall inside it.
    const off = e.offset, lim = off + 29.6;
    let k = all.findIndex(l => Math.abs(l.t - e.t) < .05);
    if (k < 0) k = all.findIndex(l => l.t >= e.t - .5);
    const inside = j => all[j] && all[j].x && all[j].t >= off + .2 && (all[j + 1]?.t ?? all[j].t + 4) <= lim + 1.5;
    let from = k; if (inside(k - 1) && e.t - all[k - 1].t < 9) from = k - 1;
    let to = k; while (to < k + 2 && inside(to + 1)) to++;
    const lines = [];
    for (let j = from; j <= to; j++) if (all[j].x) lines.push({ t: all[j].t, end: Math.min(all[j + 1]?.t ?? all[j].t + 4, lim), x: all[j].x, target: j === k });
    const start = Math.max(off + .05, lines[0].t - 1.2);
    let end = Math.min(lim, lines.at(-1).end + .4);
    if (end - start > 20) end = start + 20;
    return { lines, start, end };
  });
  lyr.set(i, p);
  p.catch(() => lyr.delete(i));
  return p;
}
const re = f => new RegExp(`\\b(${f.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})\\b`, 'i');
function lineHTML(L, form) {
  const words = L.x.split(/\s+/);
  const r = L.target ? re(form) : null;
  return words.map(w => {
    if (r && r.test(w)) return `<span class="lw tw">${esc(w)}</span>`;
    return `<span class="lw">${esc(w)}</span>`;
  }).join(' ');
}
async function fillLyrics(i, root) {
  const box = root.querySelector('.lyrics-in');
  if (!box || box.dataset.ok) return;
  try {
    const L = await loadLyrics(i);
    box.innerHTML = L.lines.map(l => `<p class="ln">${lineHTML(l, DATA[i].form)}</p>`).join('');
    box.dataset.ok = 1;
  } catch {
    box.innerHTML = `<p class="lyr-msg">歌词加载失败，请检查网络后点播放重试。</p>`;
  }
}

/* ---------- rendering ---------- */
const noteIco = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 18.5A2.5 2.5 0 1 1 6.5 16c.53 0 1.02.16 1.5.44V5l11-2v12.5A2.5 2.5 0 1 1 16.5 13c.53 0 1.02.16 1.5.44V7.4l-7 1.27v9.83z"/></svg>';
const spk = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const thumb = e => e.art.replace('600x600bb', '200x200bb');
function stageHTML(i) {
  const e = DATA[i];
  return `<article class="stage" data-i="${i}">
    <div class="st-top"><span class="pill band">IELTS ${esc(e.band)}</span><span class="pill">${esc(e.pos)}</span><span class="no">#${pad(i + 1)}</span></div>
    <h2 class="st-word">${esc(e.word)}</h2>
    <div class="st-row"><button class="st-ipa" type="button" data-say="${esc(e.word)}" aria-label="朗读 ${esc(e.word)}">${spk}<span>${esc(e.phonetic)}</span></button><p class="st-mean">${esc(e.meaning)}</p></div>
    <p class="st-en">${esc(e.en)}</p>
    <div class="lyrics"><div class="lyrics-in"><p class="lyr-msg">正在加载歌词…</p></div></div>
    <div class="st-song"><img class="mini" src="${thumb(e)}" alt="" loading="lazy"><div><b>${esc(e.title)}</b><span>${esc(e.artist)}</span></div></div>
    ${e.formNote ? `<p class="st-note">${esc(e.formNote)}</p>` : ''}
    ${e.tip ? `<div class="st-tip"><b>搭配</b>${esc(e.tip)}</div>` : ''}
  </article>`;
}
const grid = $('#grid'), carousel = $('#carousel'), deskStage = $('#deskStage');
function renderGrid() {
  const q = $('#q').value.trim().toLowerCase(), band = state.band;
  let n = 0;
  grid.innerHTML = DATA.map((e, i) => {
    const b = +e.band;
    if (band === '5.5' && b > 6) return '';
    if (band === '6.5' && b !== 6.5) return '';
    if (band === '7' && b < 7) return '';
    if (q && ![e.word, e.meaning, e.title.toLowerCase(), e.artist.toLowerCase()].some(s => s.includes(q))) return '';
    n++;
    return `<button type="button" class="card" data-i="${i}">
      <span class="disc"><img src="${thumb(e)}" alt="" loading="lazy"></span>
      <span class="no">#${pad(i + 1)}</span><span class="w">${esc(e.word)}</span><span class="ph">${esc(e.phonetic)}</span>
      <span class="mn">${esc(e.pos)} ${esc(e.meaning)}</span><span class="sg"><b>${esc(e.title)}</b> · ${esc(e.artist)}</span></button>`;
  }).join('') || '<p class="empty">没有匹配的单词</p>';
  $('#countLine').textContent = (q || band) ? `${n} 个匹配` : `${DATA.length} 个单词 · ${new Set(DATA.map(e => e.artist)).size} 位歌手`;
  markCards();
}
function markCards() {
  grid.querySelectorAll('.card').forEach(c => {
    const i = +c.dataset.i;
    c.classList.toggle('on', i === state.cur);
    c.classList.toggle('done', state.done.has(DATA[i].word));
    c.classList.toggle('playing', i === state.cur && P.playing);
  });
  $('#doneCount').textContent = state.done.size;
  $('#progFill').style.width = `${state.done.size / DATA.length * 100}%`;
}

/* ---------- audio (Apple Music 30 s previews) ---------- */
const au = new Audio(); au.preload = 'auto';
au.addEventListener('playing', () => { P.playing = true; updateBtn(); });
au.addEventListener('pause', () => { P.playing = false; updateBtn(); });
au.addEventListener('error', () => { if (au.src) showErr(); });
let unlocked = false;
// iOS only lets audio start inside a tap; start (muted) right in the gesture so later swipes can play freely.
function prime(i) {
  if (unlocked) return; unlocked = true;
  au.src = DATA[i].preview; au.muted = true;
  au.play().then(() => { au.pause(); au.muted = false; }).catch(() => { au.muted = false; unlocked = false; });
}
function seekPlay(src, t) {
  const start = () => { try { au.currentTime = t; } catch {} au.muted = false; au.play().catch(() => { P.playing = false; updateBtn(); }); };
  if (au.src !== src) { au.src = src; au.addEventListener('loadedmetadata', start, { once: true }); au.load(); }
  else if (au.readyState >= 1) start();
  else au.addEventListener('loadedmetadata', start, { once: true });
}
function setDeck(i) {
  const e = DATA[i];
  $('#deckArt').src = e.art; $('#deckLabel').src = thumb(e);
  $('#deckBg').style.backgroundImage = `url("${e.art}")`;
  $('#deckTitle').textContent = e.title; $('#deckArtist').textContent = e.artist;
  $('#deckLink').href = e.appleUrl;
  $('#deckProg').style.width = '0';
}
function cue(i) { setDeck(i); }
function showErr() {
  const e = DATA[state.cur];
  const box = P.root?.querySelector('.lyrics-in');
  if (box && !box.querySelector('.play-err')) box.insertAdjacentHTML('beforeend', `<p class="lyr-msg play-err">试听加载失败，<a href="${esc(e.appleUrl)}" target="_blank" rel="noopener">去 Apple Music 听这首</a>。</p>`);
}

/* ---------- player / karaoke ---------- */
const P = { i: -1, root: null, L: null, raf: 0, playing: false, curLine: -1, timer: 0, token: 0 };
function currentRoot() { return isMobile() ? carousel.children[state.cur]?.querySelector('.stage') : deskStage.querySelector('.stage'); }
function resetVisual(root) {
  if (!root) return;
  root.classList.remove('live');
  root.querySelectorAll('.ln').forEach(l => l.classList.remove('cur', 'past'));
  root.querySelectorAll('.lw').forEach(w => w.style.removeProperty('--p'));
  const inner = root.querySelector('.lyrics-in'); if (inner) inner.style.transform = '';
}
function stop() {
  P.token++;
  clearTimeout(P.timer); cancelAnimationFrame(P.raf);
  if (!au.paused) au.pause();
  P.playing = false; P.curLine = -1;
  resetVisual(P.root);
  updateBtn();
}
async function play(i) {
  stop();
  const token = P.token;
  P.i = i; P.root = currentRoot();
  await fillLyrics(i, P.root);
  let L; try { L = await loadLyrics(i); } catch { return; }
  if (token !== P.token) return;
  P.L = L;
  P.lineEls = [...P.root.querySelectorAll('.ln')];
  P.wordEls = P.lineEls.map(l => [...l.querySelectorAll('.lw')]);
  P.box = P.root.querySelector('.lyrics'); P.inner = P.root.querySelector('.lyrics-in');
  P.root.classList.add('live');
  $('#clipTag').textContent = `片段 ${fmt(L.start)}–${fmt(L.end)}`;
  seekPlay(DATA[i].preview, L.start - DATA[i].offset);
  const w = DATA[i].word; if (!state.done.has(w)) { state.done.add(w); store.set('stw.done', [...state.done]); markCards(); }
  P.raf = requestAnimationFrame(frame);
  preload(i + 1); preload(i + 2);
}
function preload(i) { if (i < DATA.length) loadLyrics(i).catch(() => {}); }
function frame() {
  const t = au.currentTime + DATA[P.i].offset; // position on the full-track (LRC) timeline
  if (!au.paused && t >= P.L.start - .5) {
    render(t);
    $('#deckProg').style.width = `${Math.min(100, Math.max(0, (t - P.L.start) / (P.L.end - P.L.start) * 100))}%`;
  }
  if ((!au.paused && t >= P.L.end) || au.ended) return ended();
  P.raf = requestAnimationFrame(frame);
}
function render(t) {
  const L = P.L.lines;
  let cur = -1; for (let k = 0; k < L.length; k++) if (t >= L[k].t - .08) cur = k;
  if (cur !== P.curLine) {
    P.lineEls.forEach((el, k) => { el.classList.toggle('cur', k === cur); el.classList.toggle('past', k < cur); });
    if (P.curLine >= 0) P.wordEls[P.curLine]?.forEach(w => w.style.removeProperty('--p'));
    P.curLine = cur;
    const el = P.lineEls[Math.max(0, cur)];
    if (el && P.inner) {
      const top = Math.max(0, el.offsetTop - (P.box.clientHeight - el.offsetHeight) / 2);
      P.inner.style.transform = `translateY(${-top}px)`;
    }
  }
  if (cur >= 0) {
    // LRC gives line timing only; spread the fill across the words, weighted by length.
    const line = L[cur], words = P.wordEls[cur] || [];
    const span = Math.min(line.end - line.t, .34 * line.x.length / 3 + .6) * .92;
    const total = words.reduce((a, w) => a + w.textContent.length + 1, 0);
    let acc = 0;
    words.forEach(w => {
      const s = line.t + span * acc / total; acc += w.textContent.length + 1;
      const e = line.t + span * acc / total;
      const p = t <= s ? 0 : t >= e ? 1 : (t - s) / (e - s);
      if (w._p !== p) { w._p = p; w.style.setProperty('--p', p.toFixed(3)); if (w.classList.contains('tw')) w.classList.toggle('hit', p > 0); }
    });
  }
  $('#time').textContent = `${fmt(Math.max(0, t - P.L.start))} / ${fmt(P.L.end - P.L.start)}`;
}
function ended() {
  au.pause(); P.playing = false; updateBtn();
  P.lineEls.forEach(l => { l.classList.remove('cur'); l.classList.add('past'); });
  const token = P.token;
  P.timer = setTimeout(() => {
    if (token !== P.token) return;
    if (state.loop) play(P.i);
    else if (state.auto) go(state.cur + 1, true);
    else { resetVisual(P.root); }
  }, 900);
}
function updateBtn() {
  const on = P.playing;
  $('#icoPlay').toggleAttribute('hidden', on); $('#icoPause').toggleAttribute('hidden', !on);
  $('#play').setAttribute('aria-label', on ? '暂停' : '播放');
  document.body.classList.toggle('is-playing', on);
  markCards();
}
function toggle() {
  if (P.i !== state.cur || !P.L) return play(state.cur);
  if (P.playing) { au.pause(); cancelAnimationFrame(P.raf); P.playing = false; }
  else if (P.root.classList.contains('live') && au.currentTime + DATA[P.i].offset < P.L.end - .2) { au.play().catch(() => {}); P.raf = requestAnimationFrame(frame); }
  else return play(state.cur);
  updateBtn();
}

/* ---------- navigation ---------- */
let suppressScroll = false, scrollT = 0;
let artFlip = false;
function setArt(i) {
  const [on, off] = artFlip ? [$('#artA'), $('#artB')] : [$('#artB'), $('#artA')];
  artFlip = !artFlip;
  on.style.backgroundImage = `url("${DATA[i].art}")`;
  on.classList.add('show'); off.classList.remove('show');
}
function go(i, autoplay) {
  i = (i + DATA.length) % DATA.length;
  if (i !== state.cur || !artFlip) setArt(i);
  stop();
  state.cur = i; P.i = -1; P.L = null;
  if (isMobile()) {
    const slide = carousel.children[i];
    if (slide && Math.abs(carousel.scrollLeft - slide.offsetLeft) > 2) { suppressScroll = true; carousel.scrollTo({ left: slide.offsetLeft, behavior: 'auto' }); setTimeout(() => suppressScroll = false, 80); }
  } else deskStage.innerHTML = stageHTML(i);
  P.root = currentRoot();
  fillLyrics(i, P.root);
  if (isMobile()) { [i - 1, i + 1].forEach(j => { const s = carousel.children[j]?.querySelector('.stage'); if (s) fillLyrics(j, s); }); }
  markCards();
  loadLyrics(i).then(L => { if (state.cur === i) $('#time').textContent = `0:00 / ${fmt(L.end - L.start)}`; }).catch(() => {});
  cue(i);
  if (autoplay) play(i);
}
function buildCarousel() {
  if (carousel.childElementCount) return;
  carousel.innerHTML = DATA.map((_, i) => `<div class="slide">${stageHTML(i)}</div>`).join('');
}
carousel.addEventListener('scroll', () => {
  if (suppressScroll) return;
  clearTimeout(scrollT);
  scrollT = setTimeout(settle, 'onscrollend' in window ? 400 : 140);
}, { passive: true });
carousel.addEventListener('scrollend', () => { if (!suppressScroll) { clearTimeout(scrollT); settle(); } });
function settle() {
  const i = Math.round(carousel.scrollLeft / carousel.clientWidth);
  if (i === state.cur || i < 0 || i >= DATA.length) return;
  go(i, state.started);
}

/* ---------- wiring ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-say]'); if (!b) return;
  try { const u = new SpeechSynthesisUtterance(b.dataset.say); u.lang = 'en-GB'; u.rate = .85; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch {}
});
grid.addEventListener('click', e => {
  const c = e.target.closest('.card'); if (!c) return;
  state.started = true; $('#start').hidden = true; prime(+c.dataset.i);
  $('#browser').classList.remove('open');
  go(+c.dataset.i, true);
});
$('#q').addEventListener('input', renderGrid);
$('#bandChips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.band = b.dataset.b;
  $('#bandChips').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  renderGrid();
});
$('#play').addEventListener('click', () => { prime(state.cur); state.started = true; $('#start').hidden = true; toggle(); });
$('#prev').addEventListener('click', () => { prime(state.cur); state.started = true; go(state.cur - 1, true); });
$('#next').addEventListener('click', () => { prime(state.cur); state.started = true; go(state.cur + 1, true); });
$('#replay').addEventListener('click', () => { prime(state.cur); state.started = true; play(state.cur); });
const tog = (id, key) => { const b = $(id); b.setAttribute('aria-pressed', !!state[key]); b.addEventListener('click', () => { state[key] = !state[key]; b.setAttribute('aria-pressed', state[key]); if (key === 'auto') store.set('stw.auto', state.auto); }); };
tog('#loop', 'loop'); tog('#auto', 'auto');
$('#startBtn').addEventListener('click', () => { prime(state.cur); state.started = true; $('#start').hidden = true; play(state.cur); });
$('#openList').addEventListener('click', () => { $('#browser').classList.add('open'); grid.querySelector('.card.on')?.scrollIntoView({ block: 'center' }); });
$('#closeList').addEventListener('click', () => $('#browser').classList.remove('open'));
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (['ArrowRight', 'ArrowLeft', ' '].includes(e.key)) prime(state.cur);
  if (e.key === 'ArrowRight') { e.preventDefault(); state.started = true; go(state.cur + 1, true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); state.started = true; go(state.cur - 1, true); }
  else if (e.key === ' ') { e.preventDefault(); state.started = true; toggle(); }
});
function applyMode() {
  stop();
  if (isMobile()) { buildCarousel(); requestAnimationFrame(() => go(state.cur, false)); }
  else { $('#start').hidden = true; go(state.cur, false); }
}
mq.addEventListener('change', applyMode);

$('#totalCount').textContent = DATA.length;
renderGrid();
applyMode();
})();
</script>
</body>
</html>
